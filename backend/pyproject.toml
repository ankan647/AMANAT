[project]
name = "amanat-backend"
version = "0.1.0"
description = "AMANAT - AICTE security deposit / FDR portal backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<1.14",
  "pydantic>=2.9,<2.10",
  "pydantic-settings>=2.6,<2.7",
  "pyjwt>=2.9,<2.10",
  "bcrypt>=4.2,<4.3",
  "python-multipart>=0.0.12",
  "cryptography>=43.0,<44.0",
  "qrcode[pil]>=8.0,<8.1",
  "reportlab>=4.2,<4.3",
  "pymupdf>=1.24,<1.25",
  "apscheduler>=3.10,<3.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<8.4",
  "pytest-asyncio>=0.24,<0.25",
  "httpx>=0.27,<0.28",
  "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
